<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>

    <div class="appwindowContainer">
      <img src="../assets/images/windowapp.png" class="windowLayout">
      <img id="timerTitle" src="../assets/images/timertittle.PNG">
    
      <div class="appWindowControlsContainer">
        <button id="closedButton">
          <img src="../assets/images/closebutton.PNG" alt="Close">
        </button>
        <button id="exitButton">
          <img src="../assets/images/exitbutton.PNG" alt="Exit">
        </button>
      </div>

      <div class="appclockContainer">
        <img id="appClock" src="../assets/images/appclock.PNG" class="clockImage">
      </div>

      <div class="userInputContainer">
        <input class="timeMetrics" type="number" id="hours" placeholder="00" min="0" max="99">
        <span class="timeColon">:</span>
        <input class="timeMetrics" type="number" id="minutes" placeholder="00" min="0" max="59">
        <span class="timeColon">:</span>
        <input class="timeMetrics" type="number" id="seconds" placeholder="00" min="0" max="59">
      </div>

      <div class="timerButtonsContainer">
        <button id="start" class="timebutton">
          <img src="../assets/images/playbuttonapp.PNG" alt="Start">
        </button>
        <button id="pause" class="timebutton">
          <img src="../assets/images/pausebuttonapp.PNG" alt="Pause">
        </button>
        <button id="stop" class="timebutton">
          <img src="../assets/images/stopbuttonapp.PNG" alt="Stop">
        </button>
      </div>
    </div>  
    
    <script src="index.js"></script>
  </body>
</html>
